<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1050" viewBox="0 0 750 1050">
  <defs>
    <pattern id="kreski" width="16" height="16" patternUnits="userSpaceOnUse"
             patternTransform="rotate(69)">
      <rect width="16" height="16" fill="#C2974C"/>
      <line x1="0" y1="0" x2="0" y2="16" stroke="#000" stroke-opacity="0.12" stroke-width="6"/>
    </pattern>
  </defs>

  <rect width="750" height="1050" fill="url(#kreski)"/>

  <!-- pas górny: koszt + nazwa, wys. 120 -->
  <rect x="0" y="0" width="750" height="120" fill="#1E2430" fill-opacity="0.92"/>
  <text x="30" y="76" font-family="serif" font-size="44" fill="#ECE4D0">Podwoda wiejska</text>

  <!-- obszar ilustracji: 750 × 620 -->
  <rect x="0" y="120" width="750" height="620" fill="none" stroke="#ECE4D0"
        stroke-opacity="0.25" stroke-dasharray="12 10"/>
  <text x="375" y="440" font-family="sans-serif" font-size="30" fill="#ECE4D0"
        fill-opacity="0.55" text-anchor="middle">ILUSTRACJA</text>
  <text x="375" y="482" font-family="sans-serif" font-size="22" fill="#ECE4D0"
        fill-opacity="0.4" text-anchor="middle">750 × 620 — pełna swoboda kompozycji</text>

  <!-- tekst karty, wys. 180 -->
  <rect x="0" y="740" width="750" height="180" fill="#ECE4D0" fill-opacity="0.88"/>
  <text x="30" y="800" font-family="serif" font-size="28" fill="#1E2430">Jeden punkt zaopatrzenia i skrzypiąca oś.</text>

  <!-- pas dolny: OFN / symbole / DEF, wys. 130 -->
  <rect x="0" y="920" width="750" height="130" fill="#1E2430" fill-opacity="0.92"/>
  <text x="375" y="1000" font-family="sans-serif" font-size="26" fill="#ECE4D0"
        fill-opacity="0.6" text-anchor="middle">OFN · symbole · DEF — rysuje aplikacja</text>

  <text x="720" y="76" font-family="sans-serif" font-size="24" fill="#ECE4D0"
        fill-opacity="0.55" text-anchor="end">SUPPLY</text>
</svg>
